# Dokploy (Compose type, Compose Path: ./docker-compose.dokploy.yml). Same self-contained stack as docker-compose.yml, but:
# - only the app is published (APP_PORT, for http://<server-ip>:3005); for a domain, add it for service "app", port 3005,
#   in Dokploy's Domains tab (Traefik + dokploy-network are added by Dokploy) and set APP_URL to it;
# - no bind mounts from the repo (Dokploy re-clones it on every deploy), so the SeaweedFS config and MySQL grants are inline;
# - no container_name (breaks Dokploy logs/metrics).
# Set the variables from .env.dokploy.example in Dokploy's Environment tab.

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set in Dokploy Environment}
      MYSQL_DATABASE: file_management
      MYSQL_USER: appuser
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set in Dokploy Environment}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks: [internal]

  # One-shot: lets appuser create sibling file_management* databases (services:restore). Safe to re-run on every deploy.
  mysql-grants:
    image: mysql:8.4
    restart: "no"
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      MYSQL_PWD: ${MYSQL_ROOT_PASSWORD}
    entrypoint:
      - /bin/sh
      - -c
      - mysql -h mysql -uroot -e "GRANT ALL PRIVILEGES ON \`file_management%\`.* TO 'appuser'@'%';"
    networks: [internal]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set in Dokploy Environment}", "--appendonly", "yes"]
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [internal]

  seaweedfs:
    image: chrislusf/seaweedfs:latest
    restart: unless-stopped
    environment:
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:?set in Dokploy Environment}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:?set in Dokploy Environment}
    entrypoint:
      - /bin/sh
      - -c
      - |
        cat > /tmp/s3.json <<JSON
        {"identities":[{"name":"app","credentials":[{"accessKey":"$${AWS_ACCESS_KEY_ID}","secretKey":"$${AWS_SECRET_ACCESS_KEY}"}],"actions":["Admin","Read","Write","List","Tagging"]}]}
        JSON
        exec weed server -dir=/data -ip.bind=0.0.0.0 -master.volumeSizeLimitMB=1024 -s3 -s3.port=8333 -s3.config=/tmp/s3.json
    volumes:
      - seaweedfs-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s -o /dev/null http://127.0.0.1:8333/"]
      interval: 5s
      timeout: 3s
      retries: 30
    networks: [internal]

  seaweedfs-init:
    image: amazon/aws-cli:2.17.0
    restart: "no"
    depends_on:
      seaweedfs:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c", "aws --endpoint-url http://seaweedfs:8333 s3api head-bucket --bucket backups 2>/dev/null || aws --endpoint-url http://seaweedfs:8333 s3 mb s3://backups"]
    environment:
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_DEFAULT_REGION: us-east-1
    networks: [internal]

  clamav:
    # Needs about 1.5-3 GB RAM. Signatures are frozen in the image (the internal network has no internet).
    image: clamav/clamav:1.4
    restart: unless-stopped
    environment:
      CLAMAV_NO_FRESHCLAMD: "true"
      CLAMD_CONF_StreamMaxLength: 100M
      CLAMD_CONF_MaxFileSize: 100M
    volumes:
      - clamav-data:/var/lib/clamav
    healthcheck:
      test: ["CMD-SHELL", "clamdcheck.sh"]
      interval: 15s
      timeout: 10s
      retries: 40
      start_period: 60s
    networks: [internal]

  app:
    build: .
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      seaweedfs-init:
        condition: service_completed_successfully
      clamav:
        condition: service_healthy
    expose:
      - "3005"
    # Direct access at http://<server-ip>:${APP_PORT} (no domain yet). Keep APP_URL equal to that address.
    ports:
      - "${APP_PORT:-3005}:3005"
    environment:
      # Exact public origin, e.g. https://files.example.com. Any other origin makes every change fail with 403.
      APP_URL: ${APP_URL:?set in Dokploy Environment}
      NEXAFILE_QUOTA_MB: ${NEXAFILE_QUOTA_MB:-1024}
      NEXAFILE_MAX_UPLOAD_MB: ${NEXAFILE_MAX_UPLOAD_MB:-50}
      NEXAFILE_TRASH_RETENTION_DAYS: ${NEXAFILE_TRASH_RETENTION_DAYS:-30}
      NEXAFILE_DEMO: ${NEXAFILE_DEMO:-false}
      NEXAFILE_DEMO_FULL_ADMIN: ${NEXAFILE_DEMO_FULL_ADMIN:-false}
      NEXAFILE_ADMIN_EMAILS: ${NEXAFILE_ADMIN_EMAILS:-}
      DISABLE_REGISTRATION: ${DISABLE_REGISTRATION:-false}
      DATABASE_BACKEND: mysql
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_DATABASE: file_management
      MYSQL_USER: appuser
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      REDIS_ENABLED: "true"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_USERNAME: default
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_DB: "0"
      REDIS_PREFIX: "file_management:"
      BLOB_BACKEND: s3
      S3_ENDPOINT: http://seaweedfs:8333
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      S3_BUCKET: backups
      S3_PREFIX: "file_management/"
      CLAMAV_HOST: clamav
      CLAMAV_PORT: "3310"
      ANTIVIRUS_REQUIRED: "true"
    volumes:
      # Holds server.key (encrypts 2FA secrets) and upload staging. Never delete it.
      - app-data:/data
    networks: [internal, public]

networks:
  # internal: data services get no outbound/external access.
  internal:
    internal: true
  public:

volumes:
  mysql-data:
  redis-data:
  seaweedfs-data:
  app-data:
  clamav-data:
